name: macOS native checks
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      comparison:
        description: Optional baseline commit for same-runner frame measurements
        type: string
permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            package: Miga-macOS-AppleSilicon
          - runner: macos-15-intel
            arch: x86_64
            package: Miga-macOS-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          sw_vers -productVersion
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check Cocoa and the shared pet
        run: |
          .venv/bin/python tests/macos_keys.py
          set -o pipefail
          .venv/bin/python -u tests/macos_native.py | tee "$RUNNER_TEMP/miga-cocoa-check.txt"
          grep -Fxq 'PASS: all three native frame samples.' "$RUNNER_TEMP/miga-cocoa-check.txt"
          for test in keyboards coats interactions; do .venv/bin/python "tests/$test.py"; done
      - uses: actions/checkout@v4
        if: inputs.comparison != ''
        with:
          ref: ${{ inputs.comparison }}
          path: comparison
          persist-credentials: false
      - name: Compare native frame clocks
        if: inputs.comparison != ''
        run: |
          for tree in comparison .; do
            echo "Measuring $tree"
            .venv/bin/python tests/frame_clock.py "$(cd "$tree" && pwd)"
          done
      - name: Build native application
        run: |
          macos/build.sh
          bundle="dist/$(uname -m)/Miga.app"
          test "$(lipo -archs "$bundle/Contents/MacOS/Miga")" = "$(uname -m)"
          codesign --verify --deep --strict "$bundle"
          echo "Bundle minimum macOS $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$bundle/Contents/Info.plist")"
      - name: Package and verify the extracted app
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          bundle="dist/$(uname -m)/Miga.app"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "dist/$PACKAGE.zip"
          ditto -x -k "dist/$PACKAGE.zip" "$RUNNER_TEMP/unpacked"
          codesign --verify --deep --strict "$RUNNER_TEMP/unpacked/Miga.app"
          cmp assets/icons/miga.icns "$RUNNER_TEMP/unpacked/Miga.app/Contents/Resources/miga.icns"
      - name: Install, launch, update and remove
        run: |
          bundle="$RUNNER_TEMP/unpacked/Miga.app"
          macos/install.sh --app "$bundle"
          .venv/bin/python tests/macos_launcher.py
          macos/install.sh --app "$bundle"
          macos/uninstall.sh
          test ! -e "$HOME/Applications/Miga.app"
          test ! -e "$HOME/.local/bin/miga"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}.zip
          if-no-files-found: error
          compression-level: 0
