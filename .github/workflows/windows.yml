name: Windows native checks
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: Miga prueba ñ
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install for the runner user
        working-directory: Miga prueba ñ
        run: |
          .\install.ps1 -Python (Get-Command python.exe).Source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$pwd\windows\bin" >> $env:GITHUB_PATH
      - name: Exercise the native Qt window, Raw Input and launchers
        working-directory: Miga prueba ñ
        run: |
          $python = '.\.venv-win\Scripts\python.exe'
          & $python -c "from PySide6.QtCore import QSettings; s=QSettings('desktop-pet','mascota'); s.setValue('size',150); s.setValue('appearance/coat','calico'); s.setValue('keyboard/format','65'); s.sync()"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($test in 'windows_keys', 'windows_native', 'windows_launcher', 'keyboards', 'coats') {
            & $python "tests/$test.py"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          foreach ($scale in '1.25', '1.5', '1.75', '2') {
            $env:QT_SCALE_FACTOR = $scale
            & $python tests/windows_native.py --dpi
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Remove-Item Env:QT_SCALE_FACTOR
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Miga Desktop Pet.lnk'
          Start-Process -FilePath $shortcut
          & $python tests/windows_launcher.py --wait-ready
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          miga
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          miga off
          exit $LASTEXITCODE
      - name: Build and start the portable folder
        working-directory: Miga prueba ñ
        run: |
          .\windows\build.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv-win\Scripts\python.exe -c "import shutil; shutil.make_archive('dist/Miga-Windows-x64', 'zip', 'dist', 'Miga'); shutil.unpack_archive('dist/Miga-Windows-x64.zip', 'dist/unpacked')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv-win\Scripts\python.exe tests/windows_launcher.py "$pwd\dist\unpacked\Miga\Miga.exe"
          exit $LASTEXITCODE
      - name: Check reinstall and uninstall
        working-directory: Miga prueba ñ
        run: |
          .\install.ps1 -Python (Get-Command python.exe).Source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\uninstall.ps1 -Python (Get-Command python.exe).Source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path .venv-win) { throw 'Installation was not removed' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Miga Desktop Pet.lnk')) { throw 'Shortcut was not removed' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User').Split(';') -contains "$pwd\windows\bin") { throw 'Owned PATH entry remains' }
          $prefs = 'HKCU:\Software\desktop-pet\mascota'
          if ((Get-ItemPropertyValue $prefs size) -ne 150 -or (Get-ItemPropertyValue "$prefs\appearance" coat) -ne 'calico' -or (Get-ItemPropertyValue "$prefs\keyboard" format) -ne '65') { throw 'Reinstall or uninstall lost preferences' }
      - uses: actions/upload-artifact@v4
        with:
          name: Miga-Windows-x64
          path: Miga prueba ñ/dist/Miga-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
